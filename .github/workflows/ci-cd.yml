name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never two deployments to the same server at once
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: Shell script syntax check
        run: bash -n scripts/*.sh

  deploy:
    name: Deploy to cPouta
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.CPOUTA_HOST }}
      SSH_USER: ${{ secrets.CPOUTA_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH key and known_hosts
        env:
          SSH_KEY: ${{ secrets.CPOUTA_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPOUTA_KNOWN_HOSTS }}
        run: |
          if [ -z "$KNOWN_HOSTS" ]; then
            echo '::error::The CPOUTA_KNOWN_HOSTS secret is missing'
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host cpouta
            HostName $HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: Copy the code to the server (rsync)
        run: |
          rsync -az --delete --chmod=D755,F644 --exclude '.git' --exclude '.github' --exclude '__pycache__' --exclude '.pytest_cache' --exclude '.ruff_cache' --exclude 'REVISION' ./ cpouta:/opt/chatapp/app/

      - name: Run the deploy script
        run: |
          ssh cpouta "bash /opt/chatapp/app/scripts/deploy.sh ${{ github.sha }}"

      - name: Public smoke test
        run: |
          # The whole chain: Nginx -> /viikko5/ snippet -> socket -> Gunicorn -> Flask
          curl -fsS --retry 5 --retry-delay 3 "http://$HOST/viikko5/health" | grep -qx "${{ github.sha }}"
          curl -fsS "http://$HOST/viikko5/" | grep -q 'chat-form'
          curl -fsS -o /dev/null "http://$HOST/viikko5/static/app.js"
          echo "The chat answers at http://$HOST/viikko5/"

      - name: Server memory and disk
        run: |
          ssh cpouta 'free -h; df -h /'