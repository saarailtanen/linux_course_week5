# Nginx SNIPPET: the chat app under /viikko5/
#
# This is NOT a site (there is no server block). It is included inside the existing
# server block, so the same Nginx keeps serving the earlier weeks.
# deploy.sh copies this file to /etc/nginx/snippets/chatapp.conf.
#
# ^~ means: if the path starts with /viikko5/, do not try the site's regex locations
# (for example one for .css or .js files) that could otherwise catch the request.

location = /viikko5 {
    return 301 /viikko5/;
}

# Static files come straight from disk
location ^~ /viikko5/static/ {
    alias /opt/chatapp/app/static/;
    expires 1h;
    add_header Cache-Control public;
}

location ^~ /viikko5/ {
    # The trailing slash after the socket path strips the prefix: /viikko5/api/chat -> /api/chat
    proxy_pass http://unix:/run/chatapp/gunicorn.sock:/;
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Prefix /viikko5;

    client_max_body_size 64k;

    # The reply is streamed token by token, so do not buffer it
    proxy_buffering off;
    proxy_cache off;

    # A model on a small CPU can be slow
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
